# .github/workflows/garde-fou.yml
#
# AJOUTÉ le 25/08/2026, revue « et sur GitHub ? » : le hook local
# (githooks/pre-commit) a deux trous que gitleaks documente lui-même comme
# la raison d'être d'un "programme de scan en couches" — pre-commit local
# PUIS scan en CI sur chaque push/PR, jamais l'un sans l'autre :
#   1. Le hook local ne protège que les machines où quelqu'un a pensé à
#      lancer `git config core.hooksPath githooks` une fois. Un clone neuf,
#      sans cette étape, n'a AUCUNE protection.
#   2. `git commit --no-verify` contourne le hook local par construction
#      (échappatoire volontaire, documentée dans le hook) — rien ne
#      rattrape ça une fois que c'est poussé sur un dépôt PUBLIC et jugé.
#
# Cette CI est la couche qui ne dépend d'aucune des deux : elle tourne sur
# GitHub même, sur le vrai contenu poussé, visible comme coche verte/rouge
# sur chaque commit et PR — y compris pour un juge qui parcourt le repo.
#
# CE QU'ELLE NE COUVRE PAS, corrigé le 27/08 après reproduction : le trou n°2
# ci-dessus était surestimé pour les IDENTIFIANTS, et précisément pour eux.
# controle_aucun_identifiant_dans_les_fichiers_publies() cherche par VALEUR
# EXACTE — un bon choix, aucun faux positif possible — mais il lui faut des
# valeurs à comparer, prises dans l'environnement ou dans les fichiers
# d'environnement locaux. Ici il n'y en a aucune. Mesuré sur un même dépôt
# portant une même fausse clé au format Alpaca, committée :
#
#     valeurs connues -> 🔴 BLOQUANT, « révoque cette clé »
#     aucune valeur   -> 🟡, aucune mention des identifiants
#
# Donc une clé poussée via `--no-verify` NE serait PAS rattrapée ici. Ce
# fichier affirmait le contraire ; le contrôle, lui, documentait son
# inertie en CI. Les deux ne pouvaient pas avoir raison.
#
# Le contrôle ANNONCE désormais qu'il n'a rien vérifié, au lieu de se taire :
# le log de ce job dit explicitement « ce contrôle n'a RIEN vérifié », pour
# qu'une coche verte ne se lise jamais comme « aucun identifiant publié ».
# La protection réelle contre ce cas reste le hook local, sur la machine qui
# détient les clés. Un scan par MOTIF (façon gitleaks) le couvrirait ici, au
# prix de faux positifs que ce projet a délibérément refusés jusque-là — c'est
# un arbitrage à faire, pas un oubli.
name: garde-fou

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    strategy:
      # AJOUTÉ le 28/08/2026. La CI ne testait que `3.x`, c'est-à-dire la
      # version la PLUS RÉCENTE. Or la machine qui fait tourner l'agent est en
      # Python 3.9.6 (mesuré). Résultat : « ça marche en 3.9 » n'était vérifié
      # que par la machine de l'opérateur, et « ça marche sur la dernière »
      # que par la CI — aucune des deux ne vérifiait l'autre, et un juge qui
      # clone utilise la sienne, qui peut être ni l'une ni l'autre.
      #
      # Le dossier ne déclarait AUCUNE version minimale : ni le README, ni
      # requirements.txt, ni ce fichier. Tester les deux bornes transforme une
      # hypothèse en affirmation vérifiable, ce qui est tout le propos ici.
      #
      # `fail-fast: false` pour voir les DEUX résultats : si seule 3.9 casse,
      # l'information utile est précisément laquelle.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 est nécessaire ICI précisément : le contrôle 2
          # de garde_fou.py (`.env.hackathon` scellé) lit
          # `git log --all --full-history` pour vérifier qu'aucun secret
          # n'a jamais traîné dans l'historique. Un clone superficiel
          # (fetch-depth: 1, le défaut de actions/checkout) ne verrait que
          # le dernier commit et rendrait ce contrôle aveugle sans le
          # signaler — testé une fois avant de pousser, jamais après.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Les tests d'abord : ils couvrent la chaine de sortie et le
      # disjoncteur, c'est-a-dire les seuls mecanismes qui protegent une
      # position ouverte (Alpaca ne supporte pas les ordres bracket/OCO
      # sur options). Standard library only, aucun reseau, aucun
      # identifiant : ils tournent a l'identique ici et en local.
      # `discover` plutot que de nommer test_risk_gates : le 27/08, test_agent.py
      # a ete ajoute et la CI ne l'aurait PAS lance -- un test que la CI ignore
      # ne protege rien. discover ramasse tout test_*.py, y compris ceux a venir.
      - name: python3 -m unittest discover
        run: python3 -m unittest discover -v

      - name: python3 garde_fou.py
        run: python3 garde_fou.py
